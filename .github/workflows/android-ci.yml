name: Android CI

on:
  pull_request:
    branches:
      - master
    types:
      - opened
      - synchronize
      - reopened
  push:
    branches:
      - master
    tags: [ 'v*' ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_OAUTH_CLIENT_ID: ${{ vars.OAUTH_CLIENT_ID || secrets.OAUTH_CLIENT_ID }}
      AUDIO_HAPTICS_SDK_REF: b3f97c3bb7500ea7b1985aea568e5c7b40308d3b # post-v0.5.14 capability-aware Android renderer
      AUDIO_HAPTICS_SDK_DIR: ${{ github.workspace }}/.deps/moonlight-audio-haptics
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
          fetch-tags: true

      - name: Checkout audio haptics SDK
        uses: actions/checkout@v4
        with:
          repository: AlkaidLab/moonlight-audio-haptics
          ref: ${{ env.AUDIO_HAPTICS_SDK_REF }}
          path: .deps/moonlight-audio-haptics

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Android SDK/NDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools platforms;android-36 build-tools;36.0.0 ndk;28.2.13676358

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses > /dev/null

      - name: Remove local.properties (if present)
        run: rm -f local.properties

      - name: Create google-services.json from secrets
        shell: bash
        run: |
          if [ -n "${{ secrets.GOOGLE_SERVICES_JSON }}" ]; then
            mkdir -p app
            # 清理并验证 JSON 格式
            echo '${{ secrets.GOOGLE_SERVICES_JSON }}' | tr -d '\r' | sed 's/^[[:space:]]*//;s/[[:space:]]*$//' > app/google-services.json
            # 验证 JSON 格式
            if python3 -m json.tool app/google-services.json > /dev/null 2>&1; then
              echo "Created valid google-services.json from secrets"
            else
              echo "ERROR: Invalid JSON format in GOOGLE_SERVICES_JSON secret"
              exit 1
            fi
          else
            echo "GOOGLE_SERVICES_JSON not set; skipping file creation"
          fi

      - name: Grant execute permission for Gradle
        run: chmod +x gradlew

      - name: Run lint and unit tests
        run: ./gradlew :app:lintNonRootDebug :app:testNonRootDebugUnitTest --no-daemon --stacktrace

      - name: Test release versioning
        shell: bash
        run: bash .github/release/test.sh

      - name: Compile instrumentation tests
        run: ./gradlew :app:compileNonRootDebugAndroidTestKotlin --no-daemon --stacktrace

      - name: Get version from tag
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          VERSION=${VERSION#v}
          echo "VERSION_NAME=$VERSION" >> $GITHUB_ENV
          echo "Using version from tag: $VERSION"

      - name: Update version in build.gradle
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -e
          TAG=${GITHUB_REF#refs/tags/}
          # 移除版本号前缀 'v' 如果存在
          VERSION=${TAG#v}
          echo "Updating version to: $VERSION"

          # 每个 MAJOR.MINOR.PATCH 基础版本有 999 个发布槽位，按 tag 创建时间分配。
          # 这样同一基础版本下的稳定版、hotfix 和不同功能预览 tag 也不会撞号。
          # PATCH 可省略；历史 tag、前导零、Android 上限和回退基准都由脚本统一校验。
          VERSION_INFO=$(bash .github/release/version-code.sh "$TAG" app/build.gradle)
          IFS=$'\t' read -r NEW_VERSION_CODE FLOOR FLOOR_SRC <<< "$VERSION_INFO"
          echo "Version floor: $FLOOR (from $FLOOR_SRC)"

          # 允许相等（同一个 tag 重跑 CI 应当产出同样的包），只拒绝变小。
          if [ "$NEW_VERSION_CODE" -lt "$FLOOR" ]; then
            echo "ERROR: 推导出的 versionCode $NEW_VERSION_CODE 小于已发布的 $FLOOR（来自 $FLOOR_SRC）"
            echo "Android 不允许 versionCode 倒退，请检查 tag '$TAG' 是否打错。"
            exit 1
          fi

          bash .github/release/gradle-version.sh write \
            app/build.gradle \
            "$VERSION" \
            "$NEW_VERSION_CODE"
          echo "VERSION_CODE=$NEW_VERSION_CODE" >> "$GITHUB_ENV"
          echo "Updated release version (floor was $FLOOR from $FLOOR_SRC)"

      - name: Build NonRoot Debug APK
        run: ./gradlew :app:assembleNonRootDebug --no-daemon --stacktrace

      - name: Upload APK artifact
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: app-nonroot-debug-apk
          path: |
            app/build/outputs/apk/nonRoot/debug/*.apk

      # ===== Release (Signed) Build (tags only) =====
      - name: Decode keystore for Release
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > my-release.keystore
          ls -l my-release.keystore

      - name: Build signed NonRoot Release APK
        if: startsWith(github.ref, 'refs/tags/')
        env:
          KEYSTORE_PATH: ${{ github.workspace }}/my-release.keystore
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew :app:assembleNonRootRelease --no-daemon --stacktrace

      - name: Rename Release APK to Moonlight.V+.<version>.apk
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -e
          REL_DIR=app/build/outputs/apk/nonRoot/release
          # 优先使用 tag 版本号，否则从 metadata 读取
          if [ -n "$VERSION_NAME" ]; then
            VERSION="$VERSION_NAME"
            echo "Using tag version: $VERSION"
          else
            VERSION=$(python3 -c "import json; data=json.load(open('$REL_DIR/output-metadata.json')); print(data['elements'][0]['versionName'])")
            echo "Using metadata version: $VERSION"
          fi
          SRC_APK=$(ls "$REL_DIR"/*.apk | head -n 1)
          DEST="$REL_DIR/Moonlight.V+.${VERSION}.apk"
          mv "$SRC_APK" "$DEST"
          echo "Renamed APK to: $DEST"
          echo "REL_APK=$DEST" >> $GITHUB_ENV

      - name: Generate release notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          set -e
          DATE=$(date +'%Y-%m-%d')
          V="${VERSION_NAME:-${GITHUB_REF#refs/tags/}}"; V="${V#v}"
          CUR_TAG="${GITHUB_REF#refs/tags/}"
          # 只在发版 tag（v*）里找上一个版本，并显式排除当前 tag。
          # 直接取 `git tag | sed -n 2p` 会选中 issue-*-test-* 这类临时 tag，changelog 区间就错了。
          PREV_TAG=$(git tag --list 'v*' --sort=-creatordate | grep -Fxv "$CUR_TAG" | head -n 1 || true)
          echo "Previous release tag: ${PREV_TAG:-<none>}"
          APK_SHA256=$(sha256sum "$REL_APK" | awk '{print $1}')
          CUSTOM_NOTES="RELEASE_NOTES_V${V}_ZH.md"

          # Prefer a curated release note when one is checked in for this tag.
          if [ -f "$CUSTOM_NOTES" ]; then
            cp "$CUSTOM_NOTES" release_notes.md
            {
              echo ""
              echo "## 下载"
              echo "- APK 文件：\`Moonlight.V+.${V}.apk\`"
              echo ""
              echo "## SHA256"
              echo ""
              echo '```text'
              echo "${APK_SHA256}  Moonlight.V+.${V}.apk"
              echo '```'
              echo ""
              echo "*发布于 ${DATE}*"
            } >> release_notes.md
            exit 0
          fi

          if [ -n "$PREV_TAG" ]; then
            LOG=$(git log --pretty=format:'%s' "${PREV_TAG}..${CUR_TAG}" --no-merges || true)
          else
            LOG=$(git log --pretty=format:'%s' -n 100 --no-merges || true)
          fi

          # 按 conventional commit 前缀分类
          FEAT="" FIX="" PERF="" OTHER=""
          # 正则存入变量，避免 bash [[ =~ ]] 的括号解析问题
          RE='^(feat|fix|perf|refactor|remove|chore|ci|docs|style|test|build)(\([^)]*\))?:[[:space:]](.+)$'
          while IFS= read -r line; do
            [ -z "$line" ] && continue
            # 提取前缀和描述（支持 type(scope): desc 和 type: desc）
            if [[ "$line" =~ $RE ]]; then
              prefix="${BASH_REMATCH[1]}"
              desc="${BASH_REMATCH[3]}"
              case "$prefix" in
                feat)           FEAT+="- ✨ ${desc}"$'\n' ;;
                fix)            FIX+="- 🐛 ${desc}"$'\n' ;;
                perf|refactor)  PERF+="- ⚡ ${desc}"$'\n' ;;
                remove)         OTHER+="- 🗑️ ${desc}"$'\n' ;;
                # chore/ci/docs/style/test/build → 跳过
              esac
            fi
          done <<< "$LOG"

          # 拼装 release notes
          {
            echo "## 🌙 Moonlight V+ ${V}"
            echo ""
            echo "感谢你使用 Moonlight V+！如果喜欢，记得点亮一颗 ⭐～"
            echo ""

            if [ -n "$FEAT" ]; then
              echo "### 新增"
              printf '%s' "$FEAT"
              echo ""
            fi
            if [ -n "$PERF" ]; then
              echo "### 优化"
              printf '%s' "$PERF"
              echo ""
            fi
            if [ -n "$FIX" ]; then
              echo "### 修复"
              printf '%s' "$FIX"
              echo ""
            fi
            if [ -n "$OTHER" ]; then
              echo "### 其他"
              printf '%s' "$OTHER"
              echo ""
            fi

            # 如果所有分类都为空，列出原始提交
            if [ -z "$FEAT" ] && [ -z "$FIX" ] && [ -z "$PERF" ] && [ -z "$OTHER" ]; then
              echo "### 更新内容"
              if [ -n "$PREV_TAG" ]; then
                git log --pretty=format:'- %s' "${PREV_TAG}..${CUR_TAG}" --no-merges || true
              else
                echo "- 初始发布"
              fi
              echo ""
            fi

            echo "### 📦 下载"
            echo "- APK 文件：\`Moonlight.V+.${V}.apk\`"
            echo ""
            echo "### SHA256"
            echo ""
            echo '```text'
            echo "${APK_SHA256}  Moonlight.V+.${V}.apk"
            echo '```'
            echo ""
            echo "---"
            echo "如遇到问题，请在 [Issues](../../issues) 反馈。祝你游戏顺利、低延迟满帧！🎮"
            echo ""
            echo "*发布于 ${DATE}*"
          } > release_notes.md

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Moonlight V+ ${{ env.VERSION_NAME }}
          draft: false
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          body_path: release_notes.md
          files: |
            ${{ env.REL_APK }}
            app/build/outputs/mapping/nonRootRelease/mapping.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Release APK and mapping
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: app-nonroot-release-signed
          path: |
            app/build/outputs/apk/nonRoot/release/Moonlight.V+.*.apk
            app/build/outputs/mapping/nonRootRelease/mapping.txt

      - name: Sync released version to master
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          bash .github/release/sync-released-version.sh \
            "$VERSION_NAME" \
            "$VERSION_CODE" \
            origin \
            master \
            app/build.gradle

