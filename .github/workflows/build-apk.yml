name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [steam-controller-2026]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install NDK
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;29.0.14206865"

      - name: Build debug APK
        run: ./gradlew assembleNonRootDebug

      - uses: actions/upload-artifact@v4
        with:
          name: moonlight-steam-controller-apk
          path: app/build/outputs/apk/nonRoot/debug/*.apk
